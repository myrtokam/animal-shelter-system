<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Νέα καταχώριση · PawBase</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div class="layout"><nav id="nav" aria-label="Κύρια πλοήγηση"></nav><main class="main">
<h1 class="mb-3">Υποδοχή νέου ζώου 🐶🐱</h1>
<form id="f" class="panel" novalidate><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="name">Όνομα *</label><input id="name" class="form-control" required maxlength="120"></div>
<div class="col-md-6"><label class="form-label" for="microchip">Αριθμός microchip</label><input id="microchip" class="form-control" inputmode="numeric" placeholder="15 ψηφία"><div class="form-text">Προαιρετικό. Αν υπάρχει, πρέπει να έχει 15 ψηφία.</div></div>
<div class="col-md-4"><label class="form-label" for="species">Είδος *</label><select id="species" class="form-select" required></select></div>
<div class="col-md-4"><label class="form-label" for="sex">Φύλο</label><select id="sex" class="form-select"></select></div>
<div class="col-md-4"><label class="form-label" for="status">Κατάσταση</label><select id="status" class="form-select"></select></div>
<div class="col-md-4"><label class="form-label" for="dob">Ημ. γέννησης</label><input id="dob" type="date" class="form-control"><div class="form-check mt-1"><input id="est" type="checkbox" class="form-check-input"><label class="form-check-label" for="est">Εκτιμώμενη</label></div></div>
<div class="col-md-4"><label class="form-label" for="color">Χρώμα</label><input id="color" class="form-control"></div>
<div class="col-md-4"><label class="form-label" for="weight">Βάρος (kg)</label><input id="weight" type="number" step="0.1" min="0" class="form-control"></div>
<div class="col-md-4"><label class="form-label" for="intake">Ημ. εισαγωγής</label><input id="intake" type="date" class="form-control"></div>
<div class="col-md-8 d-flex align-items-end gap-4"><div class="form-check"><input id="ster" type="checkbox" class="form-check-input"><label class="form-check-label" for="ster">Στειρωμένο</label></div><div class="form-check"><input id="needs" type="checkbox" class="form-check-input"><label class="form-check-label" for="needs">Ειδικές ανάγκες</label></div></div>
<div class="col-12"><label class="form-label" for="desc">Περιγραφή</label><textarea id="desc" class="form-control" rows="3"></textarea></div>
</div><div id="msg" class="mt-3" role="status"></div>
<div class="mt-3"><button class="btn btn-teal">Αποθήκευση ζώου</button> <a class="btn btn-outline-secondary" href="animals.html">Ακύρωση</a></div></form>
</main></div><script src="js/api.js"></script><script src="js/app.js"></script>
<script>
const fill=(id,o)=>document.getElementById(id).innerHTML=Object.entries(o).map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join("");
fill("species",SPECIES);fill("sex",SEX);fill("status",STATUSES);document.getElementById("sex").value="UNKNOWN";
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const $=id=>document.getElementById(id),msg=$("msg");
  const chip=$("microchip").value.trim();
  if(!$("name").value.trim()){msg.innerHTML='<div class="alert alert-danger">Συμπλήρωσε το όνομα του ζώου.</div>';return;}
  if(chip&&!/^\d{15}$/.test(chip)){msg.innerHTML='<div class="alert alert-danger">Το microchip πρέπει να έχει ακριβώς 15 ψηφία.</div>';return;}
  const a={name:$("name").value.trim(),microchip_number:chip,species_id:+$("species").value,sex:$("sex").value,status_id:+$("status").value,
    date_of_birth:$("dob").value||null,birth_date_is_estimated:$("est").checked,color:$("color").value.trim(),weight:parseFloat($("weight").value)||null,
    intake_date:$("intake").value||null,sterilized:$("ster").checked,special_needs:$("needs").checked,description:$("desc").value.trim()};
  try{await api.createAnimal(a);location.href="animals.html";}
  catch(err){msg.innerHTML='<div class="alert alert-danger">Η αποθήκευση απέτυχε: '+esc(err.message)+'</div>';}
});
</script></body></html>
