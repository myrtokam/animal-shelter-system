<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ζώα · PawBase</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div class="layout"><nav id="nav" aria-label="Κύρια πλοήγηση"></nav><main class="main">
<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="m-0">Τα ζώα μας 🐾</h1><a class="btn btn-teal" href="animal-new.html">Καταχώριση ζώου</a></div>
<div class="panel"><div class="row g-2 mb-3">
<div class="col-md-6"><input id="q" class="form-control" placeholder="Αναζήτηση με όνομα ή microchip" aria-label="Αναζήτηση"></div>
<div class="col-md-3"><select id="sp" class="form-select" aria-label="Είδος"><option value="">Όλα τα είδη</option></select></div>
<div class="col-md-3"><select id="st" class="form-select" aria-label="Κατάσταση"><option value="">Όλες οι καταστάσεις</option></select></div></div>
<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Όνομα</th><th>Microchip</th><th>Είδος</th><th>Φύλο</th><th>Βάρος</th><th>Κατάσταση</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main></div><script src="js/api.js"></script><script src="js/app.js"></script>
<script>
let all=[];
const opt=(o,id)=>document.getElementById(id).insertAdjacentHTML("beforeend",Object.entries(o).map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join(""));
opt(SPECIES,"sp");opt(STATUSES,"st");
function draw(){
  const q=document.getElementById("q").value.toLowerCase(),sp=document.getElementById("sp").value,st=document.getElementById("st").value;
  const r=all.filter(a=>(!q||(a.name||"").toLowerCase().includes(q)||(a.microchip_number||"").includes(q))&&(!sp||a.species_id==sp)&&(!st||a.status_id==st));
  document.getElementById("rows").innerHTML=r.length?r.map(a=>`<tr><td>${avatar(a.species_id)}${esc(a.name)} ${a.special_needs?'<span class="badge badge-need">Ειδικές ανάγκες</span>':""}</td><td>${esc(a.microchip_number)||"—"}</td><td>${esc(SPECIES[a.species_id])}</td><td>${esc(SEX[a.sex])}</td><td>${a.weight?esc(a.weight)+" kg":"—"}</td><td><span class="badge badge-status">${esc(STATUSES[a.status_id])}</span></td></tr>`).join(""):'<tr><td colspan="6" class="muted">🐾 Κανένα ζώο δεν ταιριάζει με την αναζήτηση.</td></tr>';
}
["q","sp","st"].forEach(i=>document.getElementById(i).addEventListener("input",draw));
api.getAnimals().then(a=>{all=a;draw();});
</script></body></html>
