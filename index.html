<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Πίνακας ελέγχου · PawBase</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div class="layout"><nav id="nav" aria-label="Κύρια πλοήγηση"></nav><main class="main">
<section class="panel hero"><h1>Καλημέρα! 🐕</h1><p>Η σημερινή εικόνα του καταφυγίου μας, με μια ματιά.</p><div class="paws" aria-hidden="true">🐾🐾</div></section>
<div class="row g-3 mb-4" id="stats"></div>
<div class="panel"><div class="d-flex justify-content-between align-items-center mb-2"><h2 class="h5 m-0">Νέα μέλη της οικογένειας</h2><a class="btn btn-teal btn-sm" href="animal-new.html">Καταχώριση ζώου</a></div>
<table class="table align-middle m-0"><thead><tr><th>Όνομα</th><th>Είδος</th><th>Ημ. εισαγωγής</th><th>Κατάσταση</th></tr></thead><tbody id="recent"></tbody></table></div>
</main></div><script src="js/api.js"></script><script src="js/app.js"></script>
<script>
api.getAnimals().then(a=>{
  const n=(f)=>a.filter(f).length;
  const stats=[["Σύνολο ζώων",a.length,"🐾","#ffe2b8"],["Στο καταφύγιο",n(x=>x.status_id==1),"🏡","#cdeedb"],["Υπό θεραπεία",n(x=>x.status_id==2),"🩺","#dcecf7"],["Ειδικές ανάγκες",n(x=>x.special_needs),"💗","#fde0e5"]];
  document.getElementById("stats").innerHTML=stats.map(([l,v,i,c])=>`<div class="col-6 col-md-3"><div class="panel stat-card"><span class="stat-ico" style="background:${c}" aria-hidden="true">${i}</span><div><div class="stat">${v}</div><div class="muted">${l}</div></div></div></div>`).join("");
  const r=[...a].sort((x,y)=>(y.intake_date||"").localeCompare(x.intake_date||"")).slice(0,5);
  document.getElementById("recent").innerHTML=r.length?r.map(x=>`<tr><td>${avatar(x.species_id)}${esc(x.name)}</td><td>${esc(SPECIES[x.species_id])}</td><td>${fmtDate(x.intake_date)}</td><td><span class="badge badge-status">${esc(STATUSES[x.status_id])}</span></td></tr>`).join(""):'<tr><td colspan="4" class="muted">🐾 Δεν υπάρχουν ζώα ακόμα. Ξεκίνα με μια νέα καταχώριση.</td></tr>';
});
</script></body></html>
